name: Build and Deploy Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.16
          actions-cache-folder: 'emsdk-cache'

      - name: Configure
        run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp build-web/index.html _site/index.html
          cp build-web/relativistic-starfield.js _site/relativistic-starfield.js
          cp build-web/relativistic-starfield.wasm _site/relativistic-starfield.wasm
          cp build-web/relativistic-starfield.data _site/relativistic-starfield.data
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
